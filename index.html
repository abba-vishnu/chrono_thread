<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Chrono-Thread</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="game-stage">
  <div id="ui">
    <div id="score-row">
      <div id="score">0</div>
    </div>
    <div id="hud-row">
      <div id="lives"></div>
    </div>
    <div id="tier-banner"></div>
  </div>

  <!-- Diegetic In-World Sync Multiplier Display -->
  <div id="world-combo-anchor" aria-hidden="true">
    <div id="combo"></div>
  </div>

  <div id="snap-btn">SURGE</div>

  <!-- Mobile-First Game Over Overlay -->
  <div id="gameover-overlay" class="hidden" aria-hidden="true">
    <div class="gameover-card">
      <div class="gameover-tag">CHRONO-THREAD</div>
      <h1 class="gameover-title">THREAD SEVERED</h1>

      <div class="hero-stat-box">
        <div class="hero-stat-label">WALLS CLEARED</div>
        <div id="go-walls" class="hero-stat-value">0</div>
        <div id="go-best-badge" class="best-badge hidden">NEW RECORD</div>
      </div>

      <div class="secondary-stats-row">
        <div class="sub-stat-box">
          <div class="sub-stat-label">SCORE</div>
          <div id="go-score" class="sub-stat-value">0</div>
        </div>
        <div class="sub-stat-box">
          <div class="sub-stat-label">BEST WALLS</div>
          <div id="go-best-walls" class="sub-stat-value">0</div>
        </div>
      </div>

      <button id="restart-btn" type="button">PLAY AGAIN</button>
    </div>
  </div>

  <canvas id="game"></canvas>
</div>

<!-- Classic scripts in dependency order so index.html runs directly via file:// -->
<script src="js/config.js"></script>
<script src="js/state.js"></script>
<script src="js/physics.js"></script>
<script src="js/spawner.js"></script>
<script src="js/renderer.js"></script>
<script src="js/input.js"></script>
<script src="js/main.js"></script>
<!-- Optional standalone debug & inspector module: remove this file and tag for production -->
<script src="js/debug.js"></script>
</body>
</html>
